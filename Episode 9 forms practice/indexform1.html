<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h2>Event Registration</h2>
    <form>
        <label for="name">Username:</label>
        <input type="text" id="name" name="username">
        <br />
        <br />
        <label for="email">Email ID:</label>
        <input type="email" id="email" name="email">
        <br />
        <br />
        <label for="telephone">Contact Num:</label>
        <input type="tel" id="telephone" name="phone">
        <br />
        <br />
        <label for="occupationType">Occupation</label>
        <select name="occupationType" id="occupationType">
            <option value="student">Student</option>
            <option value="professional">Professional</option>
            <option value="other">Other</option>
        </select>
        <br />
        <br />
        <fieldset>
            <legend>Topics of Intreset</legend>
            <label for="checkbox1">HTML</label>
            <input type="checkbox" name="checkbox" id="checkbox1">

            <label for="checkbox2">CSS</label>
            <input type="checkbox" name="checkbox" id="checkbox2">

            <label for="checkbox3">JavaScript</label>
            <input type="checkbox" name="checkbox" id="checkbox3">
        </fieldset>
        <label for="textarea">Comments:</label>
        <br />
        <textArea name="textarea1" id="textarea" cols="30" rows="10"></textArea>
        <input type="submit" value="Registration">
    </form>

</body>

</html>
